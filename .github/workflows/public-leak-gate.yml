# Public leak gate (layer C, the backstop): scans a pull request's METADATA (title, body, commit messages, branch name)
# against a denylist held in the PUBLIC_DENYLIST repository secret. It NEVER checks out or runs the pull request's code:
# it checks out the BASE commit only (so a PR that edits the scanner cannot weaken its own scan) and reads the metadata
# through the API. The scanner prints a field and term indexes only, never the input. A missing secret fails CLOSED.
name: Public leak gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Public leak gate (metadata)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the BASE commit only (never the pull request head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Assert the checked-out tree IS the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "the checked-out tree is not the base commit: refusing"; exit 1; }

      - name: Fetch the pull request metadata through the API (no code)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/leak-meta"
          mkdir -p "$meta"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.title' > "$meta/pr-title"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$meta/pr-body"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref' > "$meta/branch"
          # COMPLETENESS, or fail closed: the PR's reported commit count, at least 1 and at most 250 (the commits endpoint
          # lists no more than 250, so a larger PR cannot be enumerated), equal to the count of shas actually fetched.
          expected="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')"
          case "$expected" in ''|*[!0-9]*) echo "the commit count is unreadable: failing closed"; exit 1 ;; esac
          if [ "$expected" -lt 1 ]; then echo "the pull request reports no commits: failing closed"; exit 1; fi
          if [ "$expected" -gt 250 ]; then echo "more than 250 commits: the API cannot list them all; failing closed"; exit 1; fi
          got="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].sha' | grep -c .)" || got=0
          if [ "$got" != "$expected" ]; then echo "commit list truncated: failing closed"; exit 1; fi
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].commit.message' > "$meta/commit-msg"

      - name: Scan (prints field and term indexes only)
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          meta="$RUNNER_TEMP/leak-meta"
          worst=0
          for field in pr-title pr-body branch commit-msg; do
            rc=0
            out="$(node tools/public-leak-scan/scan.mjs --field "$field" --list-env PUBLIC_DENYLIST < "$meta/$field")" || rc=$?
            printf '%s\n' "$out"
            # The scanner's caller contract: PASS is exit 0 AND the output exactly "PASS"; anything else cannot be trusted.
            if [ "$rc" -eq 0 ] && [ "$out" != "PASS" ]; then rc=2; fi
            case "$out" in "FAIL field=$field terms=#"*) ;; *) [ "$rc" -eq 1 ] && rc=2 ;; esac
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then rc=2; fi
            [ "$rc" -gt "$worst" ] && worst=$rc
          done
          if [ "$worst" -eq 1 ]; then
            echo "A denylisted term is in this pull request's text (field and term index above). Edit the text to remove it."
            echo "A revision with the term already exists in this pull request's history: tell the maintainer, because only the web UI removes it."
            exit 1
          fi
          if [ "$worst" -ne 0 ]; then
            echo "The scan could not run (the denylist is unavailable or invalid): failing closed."
            exit 1
          fi

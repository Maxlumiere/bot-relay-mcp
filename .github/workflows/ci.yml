name: CI

on:
  push:
    branches: [main]
  # Run CI on EVERY pull request regardless of its BASE branch. `branches: [main]`
  # matched ONLY PRs whose base is main, so a STACKED PR (base = another feature
  # branch — e.g. a PR stacked on an unmerged arc) NEVER triggered CI and shipped
  # with an EMPTY status rollup that reads as "clean/mergeable" in the UI. That is
  # a silent hole in the pre-merge gate (an auth-adjacent PR ran zero CI). `['**']`
  # matches any base.
  # ready_for_review / labeled: a draft runs Linux only; marking it ready (or adding the `ci-full` label)
  # starts the macOS, Windows and timing-bars jobs.
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Nightly on main: the full 3-OS run plus the gate's sequential sweep, as on a push to main.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# A READY pull request cancels its superseded run when a new commit lands. Drafts never cancel (a RED pushed
# on a draft keeps its run), and neither do pushes to main or the nightly. Those runs each get their OWN group
# (the run id): a shared group without cancel-in-progress would queue them behind each other and drop the
# queued middle ones.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}

permissions:
  contents: read

jobs:
  # What this run must cover. full=false on a DRAFT pull request (unless it has the `ci-full` label) and on a
  # DOCS-ONLY pull request: then the macOS, Windows and timing-bars jobs are SKIPPED by a job-level `if:`. Never on
  # a push to main, the nightly or a dispatch: main always runs everything. A job skipped by `if:` reports Success;
  # a workflow skipped by `paths:` would leave required checks Pending, so there is no workflow-level path filter.
  # The aggregates accept a skip only for a job this Scope excluded (scripts/ci-verdict.mjs). The Linux shards and
  # the smoke ALWAYS run: about 20 test files read Markdown (README, CHANGELOG, docs/), and the gate the smoke runs
  # holds the README/docs guards, so a docs-only change can still break either.
  changes:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide the scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  # The Linux suite, split by FILE across 4 runners. "Test (Node 22)" below merges the blob reports and proves
  # the shards cover the whole suite (no file dropped, none run twice).
  shard:
    name: Test shard ${{ matrix.shard }}/4 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # #182 (2026-09): Node 20 dropped. It went EOL 2026-04-30, and better-sqlite3 13 (a native module)
        # requires Node >=22; engines.node is ">=22.0.0". Testing a runtime we no longer support would make
        # green meaningless.
        node: ['22']
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The drift-out guards (tests/v2-6-tether-transport-diagnostics.test.ts, tests/v2-7-tether-reconnection-
      # options.test.ts) read the SHIPPED extensions/vscode/out/extension.js: build the esbuild bundle first.
      - name: Build VSCode extension bundle (the drift-out guards read the shipped out/extension.js)
        run: |
          cd extensions/vscode
          npm install
          npm run bundle
      - name: Run test shard ${{ matrix.shard }}/4
        # #235: cap workers so the timing-sensitive spawn tests are not CPU-starved on a 4-vCPU runner (they
        # each spawn a daemon subprocess).
        # blob: merged by "Test (Node 22)" into the suite's totals; json: the files this shard RAN, for the
        # parity check there.
        run: npx vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=2 --reporter=default --reporter=blob --reporter=json --outputFile.json=.vitest-shard/shard-${{ matrix.shard }}.json
      # INV-DB-01 2b-ii: the single-owner measurements (racers, real daemons) run SERIAL and alone, once (shard 1).
      - name: INV-DB-01 single-owner measurements, serial (lock racers + the black-box K-process test)
        # Runs even when the shard's suite failed (a skipped measurement reads as no evidence, not as a pass).
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npx vitest run --config vitest.serial.config.ts --reporter=verbose
      # vitest 5 writes the blob report to .vitest/blob/ (MEASURED: --merge-reports read that default path and
      # .vitest-reports/ did not exist). Both reports must be there: the step fails otherwise.
      - name: Check the shard wrote both reports
        if: ${{ !cancelled() }}
        run: test -n "$(ls -A .vitest/blob 2>/dev/null)" && ls -l .vitest/blob .vitest-shard/shard-${{ matrix.shard }}.json
      - name: Upload the shard's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: |
            .vitest/blob/
            .vitest-shard/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Linux checks that are not the vitest suite: types, the extension's unit suite, the dashboard's suite, audit.
  checks:
    name: Checks (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      # v2.15.2: the esbuild BUNDLE, not the tsc per-module compile: the extension unit suite's VSIX/bundle
      # guards (v0-1-4-vsix-contents V10 + v0-1-4-bundle) inspect the real shipped artifact. `npm run
      # typecheck` keeps the extension's type safety.
      - name: Build VSCode extension bundle
        run: |
          cd extensions/vscode
          npm install
          npm run typecheck
          npm run bundle
      # The extension unit suite (root vitest's include is tests/**, which does not cover it). Its VSIX-content
      # guards shell out to `vsce package`; if they flake, add a retry there rather than dropping this gate.
      - name: Run VSCode extension unit tests
        run: |
          cd extensions/vscode
          npm run test:unit
      # The external Vercel board (dashboard/) has its own node:test suite, outside root vitest's include.
      - name: Run dashboard (board) tests
        run: |
          cd dashboard
          node --test test/*.test.mjs
      - name: npm audit (high+) — via resilience wrapper
        # Every `npm audit` in a workflow goes through scripts/audit-with-retry.sh (registry flakes):
        # guarded by tests/v2-4-3-ci-audit-bypass-guard.test.ts.
        run: bash scripts/audit-with-retry.sh high

  # BLOCKING secrets gate: gitleaks, one exact release verified by its SHA-256 (scripts/ci-gitleaks.sh), never a
  # floating tag. A canary built at runtime must be caught first, or the gate refuses to run blind. Then the commits
  # this event adds are scanned (--redact: a finding names rule, file, line and commit, never the secret). On main
  # and nightly the whole history is also scanned, REPORT ONLY.
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # The new jobs' actions are pinned to full commit SHAs (a tag can be moved under us); the rest of this file still
    # uses tags, a separate change.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned by SHA-256)
        run: bash scripts/ci-gitleaks.sh install
      - name: Canary (a runtime-built fake credential must be caught)
        run: bash scripts/ci-gitleaks.sh canary
      - name: Planted check (a fake credential committed here must BLOCK the scan; then reset)
        run: bash scripts/ci-gitleaks.sh plant-check
      - name: Scan this change's commits (blocking)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci-gitleaks.sh scan-event
      - name: Whole-history baseline (report only)
        if: github.event_name != 'pull_request'
        run: bash scripts/ci-gitleaks.sh baseline

  # BLOCKING bug lint on the lines a change ADDS (tools/lint/lint-changed.mjs; rules: tools/lint/eslint.config.mjs:
  # floating and misused promises, loose equality except `== null`, unused variables; nothing stylistic). The
  # toolchain is tools/lint's lockfile (exact versions, integrity hashes). Every rule is proven live by its canary
  # first. A pull request is linted at its HEAD commit, so the line numbers match the diff.
  lint:
    name: Lint changed lines (bug rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      # --ignore-scripts on both installs: no package's lifecycle script runs before the gate (the rules read types
      # only, and no native build is needed for that).
      - name: Install dependencies (the types the rules read)
        run: npm ci --ignore-scripts
      - name: Install the pinned lint toolchain
        run: npm ci --ignore-scripts --prefix tools/lint
      - name: Canary (every bug rule must fire where its canary says)
        run: node tools/lint/lint-changed.mjs --canary
      - name: Planted check (a floating promise on an added line must BLOCK; then reset)
        run: node tools/lint/lint-changed.mjs --plant-check
      - name: Lint the added lines (blocking)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        # A pull request is judged from its merge base, a push directly from `before`; a push that creates the branch
        # is refused by the script (no range), never skipped here.
        run: |
          if [ "$EVENT" = pull_request ]; then
            node tools/lint/lint-changed.mjs --pr "$PR_BASE" "$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            node tools/lint/lint-changed.mjs --push "$PUSH_BEFORE" "$PUSH_AFTER"
          else
            echo "lint: no change range on a $EVENT event"
          fi

  # REPORT ONLY (never blocks, never part of ci-ok): the bug rules over the WHOLE tree, counted by rule, so the
  # existing debt is visible without gating anyone on it. Complexity, duplication, unused exports and coverage are
  # follow-ups.
  quality-report:
    name: Quality report (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install the pinned lint toolchain
        run: npm ci --ignore-scripts --prefix tools/lint
      - name: Bug-rule debt over the whole tree (report only)
        run: node tools/lint/lint-changed.mjs --all

  # The PR-B timing bars measure LATENCY, so they run ALONE: on their own runner, with no suite beside them (in
  # parallel with ~300 files the runner's own noise, MEASURED 30-165 ms, exceeds the margins they resolve).
  # Each run calibrates itself: an A/A control that must pass and a sized negative control that must fail.
  # scripts/run-timing-bars.mjs asserts the EXACT set ran and passed (vitest exits 0 when -t matches nothing).
  timing-bars:
    name: Timing bars (Node 22)
    needs: changes
    # Fail SAFE: if the scope job itself did not succeed, run (a skipped job would report Success).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Timing bars, serial and isolated (failed-auth loop + availability)
        run: node scripts/run-timing-bars.mjs

  # REQUIRED CHECK (branch protection names it). The Linux verdict: every shard green, the checks green, the
  # timing bars green or skipped by scope, AND the shards together ran exactly the suite. `always()`: a job whose
  # `needs` failed is otherwise SKIPPED, and a skipped job reports Success to a required check.
  test:
    name: Test (Node 22)
    needs: [changes, shard, checks, timing-bars]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # A skip is accepted only for a job the Scope excluded (scripts/ci-verdict.mjs).
      - name: Every Linux job passed, as the Scope required
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | node scripts/ci-verdict.mjs linux
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download the shards' reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-*
          path: .
          merge-multiple: true
      - name: The 4 shards are disjoint and together are the whole suite
        run: node scripts/ci-shard-parity.mjs 4 .vitest-shard
      - name: Merge the shard reports (the suite's totals)
        run: npx vitest --merge-reports --reporter=default

  # Windows parity for the registration secret and the relay's private files (ruling efb48600 Q12). SCOPED to
  # the registration-secret tests plus the owner-only ACL check, which is checked by SID (icacls output and
  # account names are localized). The rest of the suite has never run on Windows; breakage there is reported,
  # not fixed in this job. Same scoped set on pull requests, main and nightly.
  test-windows:
    name: Test (Windows — registration secret + ACLs)
    needs: changes
    # Fail SAFE: if the scope job itself did not succeed, run (a skipped job would report Success).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    # windows-2022, not windows-latest: MEASURED, the latest image ships Visual Studio 18, which the node-gyp
    # bundled with Node 22 does not recognise ("unknown version ... Visual Studio\18"), so better-sqlite3's
    # native build failed in npm ci and NOTHING ran. Revisit when node-gyp supports it.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Registration secret + owner-only ACLs + the operator tripwire (Windows parity)
        run: npx vitest run tests/instance-sqlite-driver.test.ts tests/db-driver-header.test.ts tests/inv-db-01-header-no-fs.test.ts tests/wasm-persist-no-loss.test.ts tests/sec-23-backup-secrets.test.ts tests/pr-d-stdio-perms.test.ts tests/pr-d-mint-gate.test.ts tests/pr-d-init-mint.test.ts tests/pr-d-no-open-mint-in-tests.test.ts tests/pr-d-pair-private-write.test.ts tests/operator-tripwire.test.ts tests/operator-path-scan.test.ts tests/vitest-configs-extend-base.test.ts tests/sec-22-system-binaries.test.ts tests/sec-22-clean-env.test.ts tests/backup-archive.test.ts tests/path-walk.test.ts tests/path-walk-verdict-scan.test.ts --reporter=verbose

      # SEC-24 (the HTTP request body's structural bound), Windows parity: its black-box test runs the built daemon in a
      # child process, and a child's ESM import of an absolute path needs a file:// URL on Windows. Seen in the release
      # gate's windows-2022 in-process run (ERR_UNSUPPORTED_ESM_URL_SCHEME), which judges only the registered tests.
      # With it, the sandbox child env's allowlist controls: on Windows they MEASURE that SystemRoot is required (the
      # relay's systemBinary() resolves with it and refuses without it). Elsewhere that control is skipped.
      - name: SEC-24 structural bound + the sandbox env allowlist (Windows parity)
        run: npx vitest run tests/sec-24-structural-bound.test.ts tests/sandbox-env-node-options.test.ts

      # INV-DB-01 2b-ii: the Windows single-owner primitive (a named pipe) is measured here, serial and alone; and the
      # owner behaviour rows. ONE command per step: pwsh reports only a step's LAST command's exit code, so a red first
      # command was green (MEASURED: 10 failed tests under a passing step).
      - name: INV-DB-01 single-owner measurements, serial (Windows)
        if: ${{ !cancelled() }}
        run: npx vitest run --config vitest.serial.config.ts --reporter=verbose
      - name: INV-DB-01 owner behaviour rows (Windows)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-wasm-owner.test.ts --reporter=verbose
      - name: INV-DB-01 slice 3 by-path rows + the never-unlink scan (Windows)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-s3-by-path.test.ts tests/inv-db-01-s3-no-unlink-scan.test.ts --reporter=verbose
      # #433 R2 P1-2: the remote mint.secret's directory chain is private BEFORE its temp file exists. Its WINDOWS leg (a
      # parent with an inheritable foreign ACE) is the point, so it runs HERE, and the next step fails unless the JSON
      # report shows that ONE row PASSED (a filter that matched nothing, or a skip, would otherwise read as green).
      - name: "#433 R2 P1-2: the remote secret's directory chain row (Windows)"
        if: ${{ !cancelled() }}
        run: npx vitest run tests/hook-pr3-door-aead.test.ts -t "directory chain is private and verified BEFORE" --reporter=verbose --reporter=json --outputFile.json=r2-p1-2.json
      - name: "#433 R2 P1-2: that row PASSED (not skipped, not filtered away)"
        if: ${{ !cancelled() }}
        run: node -e "const j=require('./r2-p1-2.json');const rows=j.testResults.flatMap(f=>f.assertionResults).filter(a=>a.fullName.includes('directory chain is private and verified BEFORE'));console.log(rows.map(r=>r.status+' | '+r.fullName).join(' ; '));if(rows.length!==1||rows[0].status!=='passed'){console.error('the R2 P1-2 row did not PASS on Windows');process.exit(1)}"
      # PR 4: the CLI's credential clients (the door for a local relay; the hardened bearer for a remote) are claimed on
      # EVERY OS. This job runs a fixed list, so the file runs HERE, and the next step fails unless every row outside the
      # LAN describes PASSED (the LAN rows may skip, by name, on a runner with no LAN address).
      - name: "PR 4: the CLI's credential clients (Windows)"
        if: ${{ !cancelled() }}
        run: npx vitest run tests/cli-door-clients.test.ts --reporter=verbose --reporter=json --outputFile.json=pr4-cli.json
      - name: "PR 4: the named critical rows PASSED (not skipped, not filtered away)"
        if: ${{ !cancelled() }}
        run: node tools/ci/require-rows-passed.mjs pr4-cli.json "a tool outside the allowlist is refused" "zero credential bytes to the configured port" "its token check goes through the door, never to that port" "an UNRESOLVED relay host gets nothing" "RELAY_AGENT_TOKEN is honoured for a remote ONLY" "a remote's TRANSPORT secret" "THE ALLOWLIST, both ways" "pair proceeds to it (not the loopback refusal)" "a VALID local owner record's port" "one byte every 30 ms" "a boundary-size message goes through the door" "a private scope → its token" "REPLACED between the check and the read" "WINDOWS, an inheritable foreign ACE" "healthGet sends only GET /health" "NEGATIVE CONTROLS" "each site is in the registry"
      - name: INV-DB-01 slice 4 convert-journal + the flip + the doorbell lock (Windows)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-s4-convert.test.ts tests/inv-db-01-s4-doorbell.test.ts --reporter=verbose

      - name: Hook PR 1 mail over HTTP from a daemon owner (Windows)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/hook-pr1-owner-http.test.ts --reporter=verbose

  # REQUIRED CHECK. macOS launchd side-effect guard. The Ubuntu jobs structurally CANNOT catch a test that shells
  # to real `launchctl` — init.ts's daemon bootstrap is darwin-gated, so a `runInit` test that forgets
  # RELAY_SKIP_DAEMON silently installs a real launchd KeepAlive service + a :3777 daemon on a contributor's Mac
  # under `npm test`. This runs tests on macOS and then ASSERTS no bot-relay launchd service leaked.
  # On a PULL REQUEST it runs the macOS subset (scripts/ci-macos-pr-subset.mjs: hooks, darwin/launchctl/
  # osascript, the runInit/launchd modules, chosen at CI time); on main and nightly the FULL suite. RESIDUAL: a
  # test that reaches real launchctl without matching the subset's patterns is caught on main, not on its PR.
  test-macos:
    name: Test (macOS — launchd side-effect guard)
    needs: changes
    # Fail SAFE: if the scope job itself did not succeed, run (a skipped job would report Success).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The drift-out + ext-unit guards read the shipped extensions/vscode/out/extension.js.
      - name: Build VSCode extension bundle
        run: |
          cd extensions/vscode
          npm install
          npm run typecheck
          npm run bundle

      - name: Assert no bot-relay launchd service pre-exists on the runner
        run: |
          if launchctl list 2>/dev/null | grep -q 'com.lumiereventures.bot-relay'; then
            echo "Unexpected: a bot-relay launchd service already exists on the runner"; exit 1
          fi

      - name: Run the macOS PR subset (hooks, darwin/launchctl, runInit/launchd)
        if: github.event_name == 'pull_request'
        # #235: cap workers (timing-sensitive spawn tests).
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(node scripts/ci-macos-pr-subset.mjs)
          echo "macOS PR subset: ${#files[@]} test files"
          npx vitest run --maxWorkers=2 "${files[@]}"

      - name: Run the full test suite (main and nightly)
        if: github.event_name != 'pull_request'
        run: npx vitest run --maxWorkers=2

      # INV-DB-01 2b-ii: the macOS single-owner primitive (an O_EXLOCK dotfile) is measured here, serial and alone, on
      # every PR and on main; and the owner behaviour rows (not in the PR subset otherwise).
      - name: INV-DB-01 single-owner measurements, serial (macOS)
        if: ${{ !cancelled() }}
        run: npx vitest run --config vitest.serial.config.ts --reporter=verbose
      - name: INV-DB-01 owner behaviour rows (macOS)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-wasm-owner.test.ts --reporter=verbose
      - name: INV-DB-01 slice 3 by-path rows + the never-unlink scan (macOS)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-s3-by-path.test.ts tests/inv-db-01-s3-no-unlink-scan.test.ts --reporter=verbose
      - name: INV-DB-01 slice 4 convert-journal + the flip + the doorbell lock (macOS)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/inv-db-01-s4-convert.test.ts tests/inv-db-01-s4-doorbell.test.ts --reporter=verbose

      - name: Hook PR 1 mail over HTTP from a daemon owner (macOS)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/hook-pr1-owner-http.test.ts --reporter=verbose

      - name: Timing bars, serial and isolated (failed-auth loop + availability)
        # Latency bars run ALONE after the tests; scripts/run-timing-bars.mjs asserts the EXACT set ran and passed.
        run: node scripts/run-timing-bars.mjs

      - name: Assert the suite installed NO real launchd service
        run: |
          if launchctl list 2>/dev/null | grep -q 'com.lumiereventures.bot-relay'; then
            echo "FAIL: a test shelled to real launchctl and installed a bot-relay daemon service:"
            launchctl list | grep bot-relay
            echo "Fix: set RELAY_SKIP_DAEMON=1 in the offending runInit test (see tests/v2-4-0-instance-cli.test.ts)."
            exit 1
          fi
          echo "OK: no bot-relay launchd service leaked"

  # REQUIRED CHECK. The pre-publish gate, run from a FRESH CLONE (no pre-build), in parallel with the tests.
  # On a PULL REQUEST it skips the gate's two suite steps (RELAY_SMOKE_SKIP_SUITE=1): the suite runs in the
  # shards above and the bars in "Timing bars"; every other gate step (the guards, the 25-tool smoke, the
  # release security gate, the pack and re-pack checks) still runs. On main and nightly the gate runs its
  # sequential sweep and the bars too. A publish always runs them: the skip is never honoured under
  # prepublishOnly (scripts/pre-publish-check.sh, tests/ci-smoke-skip-suite.test.ts).
  smoke:
    name: 25-tool smoke (Node 22)
    needs: changes
    # EVERY pull request, docs-only included: the gate holds the README/docs guards (e.g. the masthead and
    # '(current)' version guard). On a PR it takes ~1-1.5 min.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: intentionally NO `npm run build` step here. This job is the
      # fresh-clone regression lock for the gate's own ordering (v2.25.0 R1):
      # the gate must build dist/ itself before its vitest steps, because the
      # real `npm publish` runs from a fresh checkout with no dist. Pre-building
      # here (as every other CI job does) would mask a test-before-build
      # regression — exactly the class that failed Maxime's 2.25.0 publish live.
      # If someone reorders the gate so a test runs before the build, this job
      # goes red (no dist → the dist-importing tests fail). Keep it build-less.

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run 25-tool smoke against isolated relay (fresh-clone gate — no pre-build)
        # RELAY_SMOKE_ONLY marks this as the CI SMOKE invocation (exercise the
        # always-on gate steps), so the publish-only gates (branch-identity,
        # CI-green) SKIP here — CI checks out non-main PR branches and cannot
        # assert its own in-flight run. This is a DEDICATED internal flag, not a
        # generic CI var: `npm publish` never sets it, and the gate ignores it
        # during an actual publish anyway (see _relay_is_ci_smoke).
        run: bash scripts/pre-publish-check.sh
        env:
          RELAY_SMOKE_ONLY: '1'
          RELAY_SMOKE_SKIP_SUITE: ${{ github.event_name == 'pull_request' && '1' || '' }}

  # The ONE check to require once branch protection is switched to it (a repository settings change, listed in the
  # PR): green only when every job above succeeded, or was skipped because the Scope excluded it. `always()` so
  # that it reports even when a job it needs failed (a skipped aggregate would read as Success).
  ci-ok:
    name: ci-ok
    needs: [changes, shard, checks, timing-bars, test, test-windows, test-macos, smoke, secrets, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # A skip is accepted only for a job the Scope excluded; the smoke and the Linux jobs must always succeed.
      - name: Every job succeeded, or was skipped because the Scope excluded it
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | node scripts/ci-verdict.mjs all

name: Native build (from-source ABI gate)

# WHY THIS EXISTS (separate from ci.yml):
#   ci.yml runs `npm ci`, which on ubuntu-latest + Node 20/22 installs a PREBUILT
#   better-sqlite3 binary — CI never COMPILES the native addon. So CI is the
#   configuration LEAST likely to catch a native ABI / compile break, while the
#   exposed users (musl/Alpine, ARM, an off-matrix Node minor) are exactly the
#   ones who compile from source and get zero coverage. This job FORCES the
#   from-source compile and runs the full suite against the compiled binary, so a
#   break in better-sqlite3's native layer fails HERE instead of on a user's box.
#
# WHY NOT EVERY PR (the argument):
#   Our TypeScript changes cannot introduce a native-ABI break — the binary
#   depends on the better-sqlite3 version + the Node ABI, not on our code. So
#   every-PR would tax every unrelated PR for a failure it structurally cannot
#   cause. A native break ORIGINATES from (a) a dependency bump — caught by the
#   package.json / package-lock path filter (this also auto-gates the pending
#   better-sqlite3 major, PR #81); (b) a Node-matrix change — caught by the ci.yml
#   path filter; or (c) runner-image / toolchain / upstream drift not tied to any
#   PR — caught by the weekly schedule. workflow_dispatch covers on-demand checks.
#   NOTE: this is NOT wired as a required status check — that is a branch-protection
#   decision. As a path-filtered job it simply does not run on unrelated PRs.

on:
  pull_request:
    branches: ['**']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-build.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catches drift not tied to a dep PR
  workflow_dispatch:

jobs:
  native-build:
    name: from-source (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22'] # the two Node ABIs ci.yml claims to support
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Force node-gyp to COMPILE better-sqlite3 rather than download a prebuilt.
      # Env is scoped to THIS step so it applies to the root install only — the
      # ext install below (esbuild etc.) is left on its normal prebuilt path.
      # foreground-scripts surfaces the compile output so the verify step can read
      # it. `set -o pipefail` so a compile failure fails the step (the tee pipe
      # would otherwise mask npm's non-zero exit).
      - name: Install (forced from-source) + capture compile log
        env:
          npm_config_build_from_source: 'true'
          npm_config_foreground_scripts: 'true'
        run: |
          set -o pipefail
          npm ci 2>&1 | tee native-install.log

      # VERIFY BY OBSERVATION, not by the flag's presence — setting the flag is not
      # proof it took effect. Fail CLOSED: require positive evidence node-gyp
      # actually compiled AND that no prebuilt was downloaded. If we cannot SEE the
      # compile, the gate did not exercise the native path — that is a failure, not
      # a pass.
      - name: Verify better-sqlite3 was COMPILED, not downloaded
        run: |
          if ! grep -qE 'gyp info spawn|node-gyp rebuild' native-install.log; then
            echo "::error::better-sqlite3 shows NO node-gyp compile evidence — the from-source gate did not exercise the native compile path"
            exit 1
          fi
          if grep -qiE 'prebuild-install[^\n]*(downloading|http request|GET )' native-install.log; then
            echo "::error::better-sqlite3 downloaded a PREBUILT binary despite build-from-source — the gate is ineffective"
            exit 1
          fi
          test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            || { echo "::error::compiled better_sqlite3.node is missing"; exit 1; }
          node -e "const D=require('better-sqlite3');const db=new D(':memory:');if(db.prepare('select 1 as x').get().x!==1)process.exit(1);console.log('from-source better-sqlite3 loads + queries OK')"

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      # Same as ci.yml: the drift-out + ext-unit guards read the shipped
      # extensions/vscode/out/extension.js, so build the bundle before the suite.
      - name: Build VSCode extension bundle
        run: |
          cd extensions/vscode
          npm install
          npm run typecheck
          npm run bundle

      - name: Run test suite (against the from-source better-sqlite3)
        run: npx vitest run

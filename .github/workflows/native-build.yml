name: Native binary (bundled prebuild + integrity)

# WHY THIS EXISTS (separate from ci.yml) — and what it now verifies:
#   Our native dependency (better-sqlite3) changed its distribution model at v13:
#   it SHIPS bundled prebuilt binaries in its tarball (prebuilds/<platform>-<arch>.node)
#   and no longer compiles at install (its install-time node-gyp is a stamp no-op).
#   So we no longer build the native addon ourselves — we accept a binary from the
#   tarball. That is a deliberate SUPPLY-CHAIN POSTURE: the guarantee moved from
#   "we compiled it from source we can read" to "the exact tarball is pinned by an
#   integrity hash."
#
#   Retiring this job would leave NOTHING watching the artefact that actually runs —
#   strictly less coverage. So it now verifies the two properties that carry the
#   guarantee today (scripts/verify-native-binary.mjs), and is NAMED for exactly them:
#     1. INTEGRITY — better-sqlite3 is pinned to an EXACT version by a registry
#        `integrity` hash. Compiling was never really about the compile; it was about
#        knowing what the binary CONTAINS. With v13 that knowledge is this hash.
#     2. LOADS — the bundled prebuild for this platform loads and answers a query.
#        That is the path users run — including musl/Alpine/ARM users, who were the
#        MOST exposed under the old compile model and now get a working bundled binary.
#
# WHY NOT EVERY PR: a native break originates from a dependency bump or a Node-matrix
#   change — both caught by the package.json / package-lock / workflow path filters
#   below — plus a weekly schedule for runner/toolchain/upstream drift. This is NOT
#   wired as a required status check; that is a branch-protection decision.

on:
  pull_request:
    branches: ['**']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-native-binary.mjs'
      - '.github/workflows/native-build.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catches drift not tied to a dep PR
  workflow_dispatch:

jobs:
  native-build:
    name: native-binary (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22'] # the one Node ABI ci.yml supports (Node 20 dropped in #182; better-sqlite3 13 needs >=22)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # v13 ships a bundled prebuild and no longer compiles at install, so a plain
      # `npm ci` is exactly what a user gets — that is the artefact we then verify.
      - name: Install (uses the bundled prebuild — v13 does not compile at install)
        run: npm ci

      - name: Verify what ships — better-sqlite3 integrity pin + bundled prebuild loads
        run: node scripts/verify-native-binary.mjs

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      # Same as ci.yml: the drift-out + ext-unit guards read the shipped
      # extensions/vscode/out/extension.js, so build the bundle before the suite.
      - name: Build VSCode extension bundle
        run: |
          cd extensions/vscode
          npm install
          npm run typecheck
          npm run bundle

      - name: Run test suite (against the shipped better-sqlite3 binary)
        run: npx vitest run
